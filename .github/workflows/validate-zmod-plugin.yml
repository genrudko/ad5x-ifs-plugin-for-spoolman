name: Validate Z-Mod plugin lifecycle

on:
  push:
    paths:
      - 'ad5x_ifs_spoolman.cfg'
      - 'install.sh'
      - 'uninstall.sh'
      - 'update.sh'
      - 'zmod-install.sh'
      - 'scripts/update_manager_hook.sh'
      - '.github/workflows/validate-zmod-plugin.yml'
  pull_request:
    paths:
      - 'ad5x_ifs_spoolman.cfg'
      - 'install.sh'
      - 'uninstall.sh'
      - 'update.sh'
      - 'zmod-install.sh'
      - 'scripts/update_manager_hook.sh'
      - '.github/workflows/validate-zmod-plugin.yml'

jobs:
  zmod-plugin-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell and Z-Mod contract
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          sh -n update.sh
          sh -n zmod-install.sh
          sh -n scripts/update_manager_hook.sh
          test -f ad5x_ifs_spoolman.cfg
          grep -F 'PLUGIN_NAME="ad5x_ifs_spoolman"' zmod-install.sh
          grep -F 'plugins.sh' zmod-install.sh
          grep -F 'mod_data/plugins/$PLUGIN_NAME' zmod-install.sh
          grep -F '[update_manager $PLUGIN_NAME]' scripts/update_manager_hook.sh
          grep -F 'type: git_repo' scripts/update_manager_hook.sh
          grep -F 'primary_branch: $PRIMARY_BRANCH' scripts/update_manager_hook.sh
          grep -F 'channel: $CHANNEL' scripts/update_manager_hook.sh
          grep -F 'AD5X_IFS_UPDATE_CHANNEL:-dev' scripts/update_manager_hook.sh
          ! grep -F 'plugin/ifs_spoolman.py' zmod-install.sh

      - name: Exercise update-manager block ownership
        run: |
          CONF=/usr/data/config/mod_data/user.moonraker.conf
          sudo rm -rf /usr/data/config/mod_data
          sudo mkdir -p /usr/data/config/mod_data
          printf '%s\n' '[authorization]' 'trusted_clients:' '  127.0.0.1' | sudo tee "$CONF" >/dev/null

          sudo env \
            AD5X_IFS_PRIMARY_BRANCH=feature/test-branch \
            AD5X_IFS_UPDATE_CHANNEL=dev \
            ./scripts/update_manager_hook.sh install
          sudo env \
            AD5X_IFS_PRIMARY_BRANCH=feature/test-branch \
            AD5X_IFS_UPDATE_CHANNEL=dev \
            ./scripts/update_manager_hook.sh install

          test "$(grep -Fc '# >>> AD5X IFS Spoolman update manager >>>' "$CONF")" -eq 1
          test "$(grep -Fc '# <<< AD5X IFS Spoolman update manager <<<' "$CONF")" -eq 1
          test "$(grep -Fc '[update_manager ad5x_ifs_spoolman]' "$CONF")" -eq 1
          grep -Fx '[authorization]' "$CONF"
          grep -Fx 'channel: dev' "$CONF"
          grep -Fx 'primary_branch: feature/test-branch' "$CONF"
          grep -Fx 'path: /root/printer_data/config/mod_data/plugins/ad5x_ifs_spoolman' "$CONF"

          sudo ./scripts/update_manager_hook.sh check
          sudo ./scripts/update_manager_hook.sh remove
          grep -Fx '[authorization]' "$CONF"
          ! grep -F 'AD5X IFS Spoolman update manager' "$CONF"
          ! grep -F '[update_manager ad5x_ifs_spoolman]' "$CONF"

      - name: Reject ownership conflicts and malformed blocks
        run: |
          CONF=/usr/data/config/mod_data/user.moonraker.conf
          printf '%s\n' '[update_manager ad5x_ifs_spoolman]' 'type: git_repo' | sudo tee "$CONF" >/dev/null
          if sudo ./scripts/update_manager_hook.sh install; then
            echo 'unmarked conflicting section was overwritten' >&2
            exit 1
          fi

          printf '%s\n' '# >>> AD5X IFS Spoolman update manager >>>' '[update_manager ad5x_ifs_spoolman]' | sudo tee "$CONF" >/dev/null
          if sudo ./scripts/update_manager_hook.sh install; then
            echo 'malformed managed block was overwritten' >&2
            exit 1
          fi

      - name: Keep legacy assignment recovery optional without host Python
        run: |
          TARGET=/tmp/ad5x-public-install-target
          LEGACY=/tmp/ad5x-public-install-legacy

          rm -rf "$TARGET" "$LEGACY"
          mkdir -p "$TARGET" "$LEGACY"
          printf '%s\n' '{"1":101,"2":null,"3":null,"4":null}' >"$LEGACY/assignments.json"

          env \
            AD5X_IFS_TARGET_DIR="$TARGET" \
            AD5X_IFS_LEGACY_SOURCE="$LEGACY" \
            AD5X_IFS_PYTHON=/definitely/missing/python \
            sh scripts/update.sh --recover-only

          test ! -e "$TARGET/assignments.json"
          ! grep -F 'scripts/update.sh" --recover-only' install.sh

      - name: Exercise existing-runtime update without exec bits or host Moonraker Python
        run: |
          TARGET=/usr/data/config/mod_data/ifs_spoolman
          SOURCE=/tmp/ad5x-portable-update-source
          FAKEBIN=/tmp/ad5x-portable-update-bin
          STOP_MARKER=/tmp/ad5x-old-stop-ran

          sudo rm -rf "$TARGET" "$SOURCE" "$FAKEBIN"
          sudo rm -f "$STOP_MARKER"
          sudo mkdir -p "$TARGET" "$FAKEBIN"

          printf '%s\n' '#!/bin/sh' 'echo stopped >'"$STOP_MARKER" | sudo tee "$TARGET/stop.sh" >/dev/null
          printf '%s\n' '#!/bin/sh' 'exit 0' | sudo tee "$TARGET/start.sh" >/dev/null
          printf '%s\n' '0.6.12-beta' | sudo tee "$TARGET/VERSION" >/dev/null
          printf '%s\n' '{"1":101,"2":null,"3":null,"4":null}' | sudo tee "$TARGET/assignments.json" >/dev/null

          # Reproduce the field report: scripts exist but are not executable.
          sudo chmod 0644 "$TARGET/stop.sh" "$TARGET/start.sh"

          cp -a . "$SOURCE"
          printf '%s\n' '#!/bin/sh' 'exit 0' >"$SOURCE/scripts/start.sh"
          chmod 0644 "$SOURCE/scripts/start.sh"

          cat >"$FAKEBIN/wget" <<'EOF'
          #!/bin/sh
          OUT=""
          while [ "$#" -gt 0 ]; do
              case "$1" in
                  -qO)
                      OUT="$2"
                      shift 2
                      ;;
                  *)
                      shift
                      ;;
              esac
          done
          [ -n "$OUT" ] || exit 2
          printf '%s\n' '{"application":"AD5X IFS Plugin for Spoolman","status":"ok"}' >"$OUT"
          EOF
          chmod +x "$FAKEBIN/wget"

          sudo env PATH="$FAKEBIN:$PATH" sh "$SOURCE/update.sh"

          sudo test -f "$STOP_MARKER"
          sudo grep -Fx "$(cat VERSION)" "$TARGET/VERSION"
          sudo test -x "$TARGET/stop.sh"
          sudo test -x "$TARGET/start.sh"
          ! grep -F '/root/moonraker-env/bin/python3' "$SOURCE/update.sh"

      - name: Keep disabled runtime disabled during source update
        run: |
          CONF=/usr/data/config/mod_data/user.moonraker.conf
          sudo rm -rf /usr/data/config/mod_data/ifs_spoolman
          printf '%s\n' '# user settings stay here' | sudo tee "$CONF" >/dev/null

          sudo ./update.sh

          test ! -e /usr/data/config/mod_data/ifs_spoolman
          grep -Fx '# user settings stay here' "$CONF"
          grep -Fx '[update_manager ad5x_ifs_spoolman]' "$CONF"
          grep -Fx 'channel: dev' "$CONF"
          grep -Fx 'primary_branch: release/standalone-0.6.x' "$CONF"
