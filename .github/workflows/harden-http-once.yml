name: Harden standalone HTTP once

on:
  push:
    branches:
      - bugfix/standalone-0.6.4-beta
    paths:
      - .github/workflows/harden-http-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/standalone-0.6.4-beta

      - name: Apply bounded HTTP fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("plugin/ifs_spoolman.py")
          text = path.read_text(encoding="utf-8")

          old_log = '    def log_message(self,fmt,*args): print("%s - %s"%(self.address_string(),fmt%args),flush=True)\n'
          new_log = '''    def log_message(self, fmt, *args):\n        # The Fluidd/UI clients poll frequently.  Do not write one access-log\n        # line per request to the unbounded stdout log; operational events are\n        # already recorded in the rotating structured events.log.\n        return\n'''
          if old_log not in text:
              raise SystemExit("expected HTTP access logger not found")
          text = text.replace(old_log, new_log, 1)

          old_read = '''    def read_json(self):\n        length=int(self.headers.get("Content-Length","0")); return json.loads(self.rfile.read(length).decode("utf-8")) if length>0 else {}\n'''
          new_read = '''    def read_json(self):\n        raw_length = self.headers.get("Content-Length", "0")\n        try:\n            length = int(raw_length)\n        except (TypeError, ValueError) as exc:\n            raise ValueError("Некорректный Content-Length") from exc\n        if length < 0 or length > 65536:\n            raise ValueError("Слишком большой JSON-запрос")\n        if length == 0:\n            return {}\n        return json.loads(self.rfile.read(length).decode("utf-8"))\n'''
          if old_read not in text:
              raise SystemExit("expected read_json implementation not found")
          text = text.replace(old_read, new_read, 1)

          old_spool = '                value=body.get("spool_id"); spool_id=int(value) if value not in (None,"",0,"0") else None\n'
          new_spool = '''                value=body.get("spool_id"); spool_id=int(value) if value not in (None,"",0,"0") else None\n                if spool_id is not None and spool_id <= 0:\n                    raise ValueError("Некорректный ID катушки Spoolman")\n'''
          if old_spool not in text:
              raise SystemExit("expected spool_id assignment parser not found")
          text = text.replace(old_spool, new_spool, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify backend
        run: |
          python3 -m py_compile plugin/ifs_spoolman.py
          rm -rf plugin/__pycache__
          grep -F 'length > 65536' plugin/ifs_spoolman.py
          grep -F 'spool_id <= 0' plugin/ifs_spoolman.py
          ! grep -F 'self.address_string(),fmt%args' plugin/ifs_spoolman.py

      - name: Commit HTTP hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/ifs_spoolman.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(http): bound requests and stop access-log growth"
          git push origin HEAD:bugfix/standalone-0.6.4-beta
