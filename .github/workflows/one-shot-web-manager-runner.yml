name: One-shot web manager runner

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve patch runner and switch to release branch
        run: |
          cp scripts/one_shot_web_manager_ux_fix.py /tmp/one_shot_web_manager_ux_fix.py
          git fetch origin release/standalone-0.6.x
          git checkout -B release/standalone-0.6.x origin/release/standalone-0.6.x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run TDD patch and push
        run: python3 /tmp/one_shot_web_manager_ux_fix.py
