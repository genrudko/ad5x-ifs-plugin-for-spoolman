name: Native Fluidd compatibility

on:
  push:
    branches:
      - main
      - feature/native-fluidd-ui-v1
      - release/standalone-0.6.x
    paths:
      - 'native-fluidd/**'
      - '.github/workflows/native-fluidd.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional ghzserg/fluidd release tag (for example v1.37.4)'
        required: false
        type: string
      publish:
        description: 'Publish the built ZIP to the rolling compatibility channels'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: native-fluidd-compatibility-release
  cancel-in-progress: false

jobs:
  build-native-fluidd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled workflows are loaded from the default branch. The native
          # compatibility source lives on the supported standalone release line.
          ref: ${{ github.event_name == 'schedule' && 'release/standalone-0.6.x' || github.ref }}
          fetch-depth: 0

      - name: Resolve upstream release and compatibility channels
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu

          UPSTREAM_REPO="$(jq -r '.upstream_repository' native-fluidd/config.json)"
          PATCH_REVISION="$(jq -r '.patch_revision' native-fluidd/config.json)"
          DIST_RELEASE_TAG="$(jq -r '.distribution_release_tag' native-fluidd/config.json)"
          RAW_BRANCH="fluidd-compatibility-files"

          if [ -n "${INPUT_UPSTREAM_TAG:-}" ]; then
            UPSTREAM_TAG="$INPUT_UPSTREAM_TAG"
          else
            UPSTREAM_TAG="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
          fi

          test -n "$UPSTREAM_TAG"
          test "$UPSTREAM_TAG" != "null"

          ASSET_NAME="fluidd-${UPSTREAM_TAG}-ifs-ui-v${PATCH_REVISION}.zip"
          SHA_ASSET_NAME="${ASSET_NAME}.sha256"
          RAW_PATH="${UPSTREAM_TAG}/ifs-ui-v${PATCH_REVISION}"

          PUBLISH_REQUESTED=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            PUBLISH_REQUESTED=true
          elif [ "$EVENT_NAME" = "push" ] && { [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "release/standalone-0.6.x" ]; }; then
            PUBLISH_REQUESTED=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_PUBLISH:-false}" = "true" ]; then
            PUBLISH_REQUESTED=true
          fi

          RELEASE_PUBLISHED=false
          RAW_PUBLISHED=false
          if [ "$PUBLISH_REQUESTED" = "true" ]; then
            if gh release view "$DIST_RELEASE_TAG" >/dev/null 2>&1; then
              RELEASE_ASSETS="$(gh release view "$DIST_RELEASE_TAG" --json assets --jq '.assets[].name')"
              if printf '%s\n' "$RELEASE_ASSETS" | grep -Fx "$ASSET_NAME" >/dev/null 2>&1 \
                && printf '%s\n' "$RELEASE_ASSETS" | grep -Fx "$SHA_ASSET_NAME" >/dev/null 2>&1; then
                RELEASE_PUBLISHED=true
              fi
            fi

            if gh api "repos/${GITHUB_REPOSITORY}/contents/${RAW_PATH}/fluidd.zip?ref=${RAW_BRANCH}" >/dev/null 2>&1 \
              && gh api "repos/${GITHUB_REPOSITORY}/contents/${RAW_PATH}/fluidd.zip.sha256?ref=${RAW_BRANCH}" >/dev/null 2>&1; then
              RAW_PUBLISHED=true
            fi
          fi

          ALL_PUBLISHED=false
          if [ "$RELEASE_PUBLISHED" = "true" ] && [ "$RAW_PUBLISHED" = "true" ]; then
            ALL_PUBLISHED=true
          fi

          {
            echo "upstream_repo=$UPSTREAM_REPO"
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "patch_revision=$PATCH_REVISION"
            echo "dist_release_tag=$DIST_RELEASE_TAG"
            echo "raw_branch=$RAW_BRANCH"
            echo "raw_path=$RAW_PATH"
            echo "asset_name=$ASSET_NAME"
            echo "sha_asset_name=$SHA_ASSET_NAME"
            echo "publish_requested=$PUBLISH_REQUESTED"
            echo "release_published=$RELEASE_PUBLISHED"
            echo "raw_published=$RAW_PUBLISHED"
            echo "all_published=$ALL_PUBLISHED"
          } >> "$GITHUB_OUTPUT"

          echo "Upstream: $UPSTREAM_REPO $UPSTREAM_TAG"
          echo "Asset: $ASSET_NAME"
          echo "Publish requested: $PUBLISH_REQUESTED"
          echo "Release published: $RELEASE_PUBLISHED"
          echo "Raw published: $RAW_PUBLISHED"

      - name: Stop early when all compatibility channels already exist
        if: steps.meta.outputs.all_published == 'true'
        run: echo 'Compatibility files already exist in release and raw channels; no rebuild required.'

      - name: Clone exact Sergey Fluidd release
        if: steps.meta.outputs.all_published != 'true'
        run: |
          set -eu
          git clone --depth 1 --branch "${{ steps.meta.outputs.upstream_tag }}" \
            "https://github.com/${{ steps.meta.outputs.upstream_repo }}.git" \
            upstream-fluidd
          cd upstream-fluidd
          git rev-parse HEAD | tee ../upstream-fluidd.commit

      - name: Apply native AD5X IFS overlay
        if: steps.meta.outputs.all_published != 'true'
        run: |
          set -eu
          python3 native-fluidd/apply_overlay.py upstream-fluidd
          grep -F "Ad5xIfsCard" upstream-fluidd/src/views/Dashboard.vue >/dev/null
          grep -F "ad5x-ifs-card" upstream-fluidd/src/store/layout/state.ts >/dev/null
          grep -F "ad5x_ifs:" upstream-fluidd/src/locales/en.yaml >/dev/null
          grep -F "ad5x_ifs:" upstream-fluidd/src/locales/ru.yaml >/dev/null

      - uses: actions/setup-node@v4
        if: steps.meta.outputs.all_published != 'true'
        with:
          node-version: '24'

      - name: Enable pinned pnpm
        if: steps.meta.outputs.all_published != 'true'
        run: corepack enable

      - name: Install Fluidd dependencies
        if: steps.meta.outputs.all_published != 'true'
        working-directory: upstream-fluidd
        run: pnpm install --frozen-lockfile

      - name: Type-check native Fluidd build
        if: steps.meta.outputs.all_published != 'true'
        working-directory: upstream-fluidd
        run: pnpm run type-check

      - name: Build native Fluidd distribution
        if: steps.meta.outputs.all_published != 'true'
        working-directory: upstream-fluidd
        run: pnpm run build

      - name: Verify upstream identity and write compatibility marker
        if: steps.meta.outputs.all_published != 'true'
        env:
          UPSTREAM_REPO: ${{ steps.meta.outputs.upstream_repo }}
          UPSTREAM_TAG: ${{ steps.meta.outputs.upstream_tag }}
          PATCH_REVISION: ${{ steps.meta.outputs.patch_revision }}
        run: |
          set -eu
          UPSTREAM_SHA="$(cat upstream-fluidd.commit)"

          test "$(cat upstream-fluidd/dist/.version)" = "$UPSTREAM_TAG"
          test "$(jq -r '.project_owner' upstream-fluidd/dist/release_info.json)" = "ghzserg"
          test "$(jq -r '.project_name' upstream-fluidd/dist/release_info.json)" = "fluidd"
          test "$(jq -r '.version' upstream-fluidd/dist/release_info.json)" = "$UPSTREAM_TAG"

          jq -n \
            --arg integration "ad5x-ifs-native" \
            --arg upstream_repository "$UPSTREAM_REPO" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg upstream_commit "$UPSTREAM_SHA" \
            --argjson patch_revision "$PATCH_REVISION" \
            '{
              integration: $integration,
              upstream_repository: $upstream_repository,
              upstream_tag: $upstream_tag,
              upstream_commit: $upstream_commit,
              patch_revision: $patch_revision
            }' > upstream-fluidd/dist/ad5x_ifs_native.json

          cat upstream-fluidd/dist/ad5x_ifs_native.json

      - name: Package compatibility ZIP
        if: steps.meta.outputs.all_published != 'true'
        env:
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
          SHA_ASSET_NAME: ${{ steps.meta.outputs.sha_asset_name }}
        run: |
          set -eu
          mkdir -p out
          (
            cd upstream-fluidd/dist
            zip -qr "../../out/$ASSET_NAME" .
          )
          (
            cd out
            sha256sum "$ASSET_NAME" > "$SHA_ASSET_NAME"
          )
          unzip -l "out/$ASSET_NAME" | grep -F 'ad5x_ifs_native.json' >/dev/null
          unzip -p "out/$ASSET_NAME" .version | grep -Fx "${{ steps.meta.outputs.upstream_tag }}" >/dev/null

      - name: Upload CI artifact
        if: steps.meta.outputs.all_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-fluidd-${{ steps.meta.outputs.upstream_tag }}-ifs-ui-v${{ steps.meta.outputs.patch_revision }}
          path: |
            out/${{ steps.meta.outputs.asset_name }}
            out/${{ steps.meta.outputs.sha_asset_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Ensure rolling compatibility release exists
        if: steps.meta.outputs.all_published != 'true' && steps.meta.outputs.publish_requested == 'true' && steps.meta.outputs.release_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_RELEASE_TAG: ${{ steps.meta.outputs.dist_release_tag }}
        run: |
          set -eu
          if ! gh release view "$DIST_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$DIST_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Native Fluidd compatibility builds" \
              --notes "Native Fluidd builds generated from exact ghzserg/fluidd releases with the standalone AD5X IFS dashboard component applied. This is a rolling compatibility-asset channel, not a replacement Fluidd fork."
          fi

      - name: Publish compatibility release assets
        if: steps.meta.outputs.all_published != 'true' && steps.meta.outputs.publish_requested == 'true' && steps.meta.outputs.release_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_RELEASE_TAG: ${{ steps.meta.outputs.dist_release_tag }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
          SHA_ASSET_NAME: ${{ steps.meta.outputs.sha_asset_name }}
        run: |
          set -eu
          gh release upload "$DIST_RELEASE_TAG" \
            "out/$ASSET_NAME" \
            "out/$SHA_ASSET_NAME"

      - name: Publish raw compatibility files
        if: steps.meta.outputs.all_published != 'true' && steps.meta.outputs.publish_requested == 'true' && steps.meta.outputs.raw_published != 'true'
        env:
          RAW_BRANCH: ${{ steps.meta.outputs.raw_branch }}
          RAW_PATH: ${{ steps.meta.outputs.raw_path }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          set -eu

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf raw-channel
          if git fetch origin "$RAW_BRANCH"; then
            git worktree add --detach raw-channel "origin/$RAW_BRANCH"
          else
            git worktree add --detach raw-channel
            (
              cd raw-channel
              git checkout --orphan "$RAW_BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          mkdir -p "raw-channel/$RAW_PATH"
          cp "out/$ASSET_NAME" "raw-channel/$RAW_PATH/fluidd.zip"
          SHA="$(sha256sum "out/$ASSET_NAME" | awk '{print $1}')"
          printf '%s  fluidd.zip\n' "$SHA" > "raw-channel/$RAW_PATH/fluidd.zip.sha256"

          git -C raw-channel add "$RAW_PATH/fluidd.zip" "$RAW_PATH/fluidd.zip.sha256"
          if git -C raw-channel diff --cached --quiet; then
            echo 'Raw compatibility files are already identical.'
          else
            git -C raw-channel commit -m "dist: add Fluidd ${{ steps.meta.outputs.upstream_tag }} IFS UI v${{ steps.meta.outputs.patch_revision }}"
            git -C raw-channel push origin HEAD:"$RAW_BRANCH"
          fi

      - name: Resolve plugin release state
        id: plugin_release
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.meta.outputs.upstream_tag }}
          PATCH_REVISION: ${{ steps.meta.outputs.patch_revision }}
        run: |
          set -eu

          STATE_FILE="native-fluidd/release-state.json"
          [ -f "$STATE_FILE" ] || {
            echo "Missing release state: $STATE_FILE" >&2
            exit 1
          }

          CURRENT_VERSION="$(cat VERSION)"
          STATE_VERSION="$(jq -r '.plugin_version // empty' "$STATE_FILE")"
          STATE_UPSTREAM="$(jq -r '.fluidd_upstream_tag // empty' "$STATE_FILE")"
          STATE_PATCH="$(jq -r '.patch_revision // empty' "$STATE_FILE")"

          [ -n "$STATE_VERSION" ] && [ -n "$STATE_UPSTREAM" ] && [ -n "$STATE_PATCH" ] || {
            echo "Incomplete release state: $STATE_FILE" >&2
            exit 1
          }
          [ "$STATE_VERSION" = "$CURRENT_VERSION" ] || {
            echo "VERSION ($CURRENT_VERSION) and release state ($STATE_VERSION) diverged." >&2
            exit 1
          }

          RELEASE_NEEDED=false
          VERSION_BUMP_NEEDED=false

          if [ "$STATE_UPSTREAM" != "$UPSTREAM_TAG" ] || [ "$STATE_PATCH" != "$PATCH_REVISION" ]; then
            RELEASE_NEEDED=true
            VERSION_BUMP_NEEDED=true
          elif ! gh release view "v${STATE_VERSION}" >/dev/null 2>&1; then
            RELEASE_NEEDED=true
          fi

          {
            echo "release_needed=$RELEASE_NEEDED"
            echo "version_bump_needed=$VERSION_BUMP_NEEDED"
          } >> "$GITHUB_OUTPUT"

          echo "Plugin release needed: $RELEASE_NEEDED"
          echo "Version bump needed: $VERSION_BUMP_NEEDED"

      - name: Verify published compatibility channels
        if: steps.plugin_release.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_RELEASE_TAG: ${{ steps.meta.outputs.dist_release_tag }}
          RAW_BRANCH: ${{ steps.meta.outputs.raw_branch }}
          RAW_PATH: ${{ steps.meta.outputs.raw_path }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
          SHA_ASSET_NAME: ${{ steps.meta.outputs.sha_asset_name }}
        run: |
          set -eu

          RELEASE_ASSETS="$(gh release view "$DIST_RELEASE_TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$RELEASE_ASSETS" | grep -Fx "$ASSET_NAME" >/dev/null
          printf '%s\n' "$RELEASE_ASSETS" | grep -Fx "$SHA_ASSET_NAME" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/contents/${RAW_PATH}/fluidd.zip?ref=${RAW_BRANCH}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/contents/${RAW_PATH}/fluidd.zip.sha256?ref=${RAW_BRANCH}" >/dev/null

      - name: Validate plugin release source
        if: steps.plugin_release.outputs.release_needed == 'true'
        run: |
          set -eu

          python3 -m py_compile plugin/ifs_spoolman.py
          rm -rf plugin/__pycache__

          sh -n install.sh
          sh -n update.sh
          sh -n zmod-install.sh
          for FILE in scripts/*.sh; do
            sh -n "$FILE"
          done

          python3 -m json.tool native-fluidd/config.json >/dev/null
          python3 -m json.tool native-fluidd/release-state.json >/dev/null

          for TEST_FILE in tests/test_*.py; do
            python3 "$TEST_FILE"
          done

          git diff --check

      - name: Advance release branch and publish plugin release
        if: steps.plugin_release.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.meta.outputs.upstream_tag }}
          PATCH_REVISION: ${{ steps.meta.outputs.patch_revision }}
          VERSION_BUMP_NEEDED: ${{ steps.plugin_release.outputs.version_bump_needed }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          set -eu

          RELEASE_BRANCH="release/standalone-0.6.x"
          STATE_FILE="native-fluidd/release-state.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$RELEASE_BRANCH"
          git fetch --tags origin
          REMOTE_HEAD="$(git rev-parse "origin/$RELEASE_BRANCH")"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          [ "$LOCAL_HEAD" = "$REMOTE_HEAD" ] || {
            echo "Release branch moved during the run: local=$LOCAL_HEAD remote=$REMOTE_HEAD" >&2
            exit 1
          }

          CURRENT_VERSION="$(cat VERSION)"
          NEW_VERSION="$CURRENT_VERSION"
          NEW_TAG="v${NEW_VERSION}"

          if [ "$VERSION_BUMP_NEEDED" = "true" ]; then
            printf '%s\n' "$CURRENT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-beta$' || {
              echo "Unsupported VERSION format: $CURRENT_VERSION" >&2
              exit 1
            }

            VERSION_CORE="${CURRENT_VERSION%-beta}"
            MAJOR="$(printf '%s' "$VERSION_CORE" | cut -d. -f1)"
            MINOR="$(printf '%s' "$VERSION_CORE" | cut -d. -f2)"
            PATCH="$(printf '%s' "$VERSION_CORE" | cut -d. -f3)"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-beta"
            NEW_TAG="v${NEW_VERSION}"

            if git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing tag: $NEW_TAG" >&2
              exit 1
            fi

            printf '%s\n' "$NEW_VERSION" > VERSION
            jq -n \
              --arg plugin_version "$NEW_VERSION" \
              --arg fluidd_upstream_tag "$UPSTREAM_TAG" \
              --argjson patch_revision "$PATCH_REVISION" \
              '{
                plugin_version: $plugin_version,
                fluidd_upstream_tag: $fluidd_upstream_tag,
                patch_revision: $patch_revision
              }' > "$STATE_FILE.tmp"
            mv "$STATE_FILE.tmp" "$STATE_FILE"

            python3 -m json.tool "$STATE_FILE" >/dev/null
            grep -Eq '^0\.6\.[0-9]+-beta$' VERSION
            for TEST_FILE in tests/test_*.py; do
              python3 "$TEST_FILE"
            done
            git diff --check

            git add VERSION "$STATE_FILE"
            git commit -m "release: support Fluidd ${UPSTREAM_TAG} (IFS UI v${PATCH_REVISION})"
            git tag "$NEW_TAG" "$(git rev-parse HEAD)"
            git push --atomic origin HEAD:"$RELEASE_BRANCH" "refs/tags/$NEW_TAG"
          else
            [ "$(jq -r '.plugin_version' "$STATE_FILE")" = "$CURRENT_VERSION" ]
            [ "$(jq -r '.fluidd_upstream_tag' "$STATE_FILE")" = "$UPSTREAM_TAG" ]
            [ "$(jq -r '.patch_revision' "$STATE_FILE")" = "$PATCH_REVISION" ]
            git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1 || {
              echo "Release state is current but tag $NEW_TAG is missing; refusing an ambiguous recovery." >&2
              exit 1
            }
          fi

          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "Plugin release already exists: $NEW_TAG"
            exit 0
          fi

          TARGET_COMMIT="$(git rev-list -n 1 "$NEW_TAG")"
          RELEASE_NOTES="$(printf '%s\n' \
            'Automatic Fluidd compatibility release.' \
            '' \
            "- Sergey Fluidd: \`${UPSTREAM_TAG}\`" \
            "- Native IFS UI patch revision: \`${PATCH_REVISION}\`" \
            "- Compatibility bundle: \`${ASSET_NAME}\`" \
            "- Source branch: \`${RELEASE_BRANCH}\`" \
            "- Source commit: \`${TARGET_COMMIT}\`" \
            '' \
            'The release commit advances the branch tracked by the AD5X Moonraker Update Manager, so installed printers can discover this plugin update normally in Fluidd.'
          )"

          gh release create "$NEW_TAG" \
            --title "AD5X IFS Spoolman $NEW_TAG" \
            --notes "$RELEASE_NOTES"

          gh release view "$NEW_TAG" --json tagName,targetCommitish,url
