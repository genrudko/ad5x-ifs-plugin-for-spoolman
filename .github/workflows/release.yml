name: Publish standalone release

on:
  push:
    branches:
      - release/standalone-0.6.x

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          [[ "$VERSION" =~ ^0\.6\.[0-9]+-beta$ ]]
          TAG="v$VERSION"
          NOTES=".github/release-notes/$TAG.md"
          test -s "$NOTES"
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "notes=$NOTES" >>"$GITHUB_OUTPUT"

      - name: Publish GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --verify-tag \
              --title "AD5X IFS Spoolman $TAG" \
              --notes-file "$NOTES" \
              --latest
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "AD5X IFS Spoolman $TAG" \
              --notes-file "$NOTES" \
              --latest
          fi
