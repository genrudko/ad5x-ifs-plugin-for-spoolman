name: Harden standalone config once

on:
  push:
    branches:
      - bugfix/standalone-0.6.4-beta
    paths:
      - .github/workflows/harden-config-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/standalone-0.6.4-beta

      - name: Constrain AD5X slot count to hardware reality
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("plugin/ifs_spoolman.py")
          text = path.read_text(encoding="utf-8")

          old = '''    return {\n        "schema_version": schema_version,\n        "moonraker_url": moonraker_url,\n        "listen_host": listen_host.strip(),\n        "listen_port": plain_int("listen_port", 1, 65535),\n        "slot_count": plain_int("slot_count", 1, 32),\n'''
          new = '''    slot_count = plain_int("slot_count", 4, 4)\n\n    return {\n        "schema_version": schema_version,\n        "moonraker_url": moonraker_url,\n        "listen_host": listen_host.strip(),\n        "listen_port": plain_int("listen_port", 1, 65535),\n        "slot_count": slot_count,\n'''

          if old not in text:
              raise SystemExit("expected slot_count validation block not found")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify backend
        run: |
          python3 -m py_compile plugin/ifs_spoolman.py
          rm -rf plugin/__pycache__
          grep -F 'slot_count = plain_int("slot_count", 4, 4)' plugin/ifs_spoolman.py
          ! grep -F 'plain_int("slot_count", 1, 32)' plugin/ifs_spoolman.py

      - name: Commit config hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/ifs_spoolman.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(config): enforce four AD5X IFS slots"
          git push origin HEAD:bugfix/standalone-0.6.4-beta
