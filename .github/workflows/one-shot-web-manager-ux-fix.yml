name: One-shot web manager UX fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-web-manager-ux-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone release
        uses: actions/checkout@v4
        with:
          ref: release/standalone-0.6.x
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write regression tests first
        run: |
          cat > tests/test_web_manager_ux.py <<'PY'
          from pathlib import Path
          import ast
          import urllib.parse

          root = Path(__file__).resolve().parents[1]
          source = (root / "plugin/ifs_spoolman.py").read_text(encoding="utf-8")
          vue = (root / "native-fluidd/overlay/src/components/widgets/ad5x-ifs/Ad5xIfsCard.vue").read_text(encoding="utf-8")

          # Polling must not destroy an open native select.
          assert "let slotsRenderPending = false;" in source
          assert "function slotSelectIsActive()" in source
          assert "function renderSlotsPreservingInteraction()" in source
          assert "select.addEventListener(\"blur\"" in source
          assert "renderSlotsPreservingInteraction();" in source

          # Web settings must expose and persist only the Spoolman web URL.
          assert 'id="spoolmanUrlInput"' in source
          assert 'id="saveConfigButton"' in source
          assert 'if self.path=="/api/config":' in source
          assert '"spoolman_url": None' in source
          assert '"spoolman_url_override": CONFIG["spoolman_url"]' in source
          assert "def update_public_config(raw):" in source

          # Validate the real config normalization code without importing the daemon.
          tree = ast.parse(source)
          wanted_assignments = {"CONFIG_SCHEMA_VERSION", "DEFAULT_CONFIG", "CONFIG_KEYS"}
          wanted_functions = {"normalize_spoolman_web_url", "validate_config"}
          nodes = []
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  names = {target.id for target in node.targets if isinstance(target, ast.Name)}
                  if names & wanted_assignments:
                      nodes.append(node)
              elif isinstance(node, ast.FunctionDef) and node.name in wanted_functions:
                  nodes.append(node)
          namespace = {"urllib": __import__("urllib"), "os": __import__("os")}
          namespace["urllib"].parse = urllib.parse
          exec(compile(ast.Module(body=nodes, type_ignores=[]), "config_subset", "exec"), namespace)
          cfg = dict(namespace["DEFAULT_CONFIG"])
          cfg["spoolman_url"] = "192.168.1.50:7912/"
          validated = namespace["validate_config"](cfg)
          assert validated["spoolman_url"] == "http://192.168.1.50:7912"
          cfg["spoolman_url"] = "ftp://192.168.1.50"
          try:
              namespace["validate_config"](cfg)
          except ValueError:
              pass
          else:
              raise AssertionError("invalid Spoolman URL must be rejected")

          # Disabled Spoolman button must remain legible, not disappear into the header.
          assert vue.count('class="ifs-spoolman-link"') == 2
          assert ".ifs-spoolman-link.v-btn--disabled" in vue
          assert "color: inherit !important;" in vue
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_native_patch_revision.py')
          text = path.read_text()
          old = "assert config['patch_revision'] == 9, f\"expected native patch revision 9, got {config['patch_revision']}\""
          new = "assert config['patch_revision'] == 10, f\"expected native patch revision 10, got {config['patch_revision']}\""
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify RED
        run: |
          set +e
          python3 tests/test_web_manager_ux.py >/tmp/web-red.log 2>&1
          web_rc=$?
          python3 tests/test_native_patch_revision.py >/tmp/native-red.log 2>&1
          native_rc=$?
          set -e
          cat /tmp/web-red.log
          cat /tmp/native-red.log
          test "$web_rc" -ne 0
          test "$native_rc" -ne 0
          echo "RED_CONFIRMED web=$web_rc native=$native_rc"

      - name: Apply minimal production fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8')

          p = Path('plugin/ifs_spoolman.py')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              '    "moonraker_url": "http://127.0.0.1:7125",\n',
              '    "moonraker_url": "http://127.0.0.1:7125",\n    "spoolman_url": None,\n',
              1,
          )

          marker = '    listen_host = result["listen_host"]\n'
          assert text.count(marker) == 1
          spoolman_validation = '''    spoolman_url_raw = result["spoolman_url"]

    if spoolman_url_raw is None or (
        isinstance(spoolman_url_raw, str) and not spoolman_url_raw.strip()
    ):
        spoolman_url = None
    elif not isinstance(spoolman_url_raw, str):
        raise ValueError(
            "config.json: spoolman_url должен быть строкой или null"
        )
    else:
        spoolman_url = normalize_spoolman_web_url(spoolman_url_raw)
        if spoolman_url is None:
            raise ValueError(
                "config.json: spoolman_url должен быть корректным HTTP/HTTPS URL "
                "без учётных данных, query и fragment"
            )

'''
          text = text.replace(marker, spoolman_validation + marker, 1)

          text = text.replace(
              '        "moonraker_url": moonraker_url,\n',
              '        "moonraker_url": moonraker_url,\n        "spoolman_url": spoolman_url,\n',
              1,
          )

          assert text.count('def get_spoolman_web_url():') == 1
          text = text.replace('def get_spoolman_web_url():', 'def get_moonraker_spoolman_web_url():', 1)

          public_marker = '\n\ndef public_config():\n'
          assert text.count(public_marker) == 1
          web_url_wrapper = '''

def get_spoolman_web_url():
    configured = CONFIG.get("spoolman_url")
    if configured:
        return configured
    return get_moonraker_spoolman_web_url()
'''
          text = text.replace(public_marker, web_url_wrapper + public_marker, 1)

          text = text.replace(
              '        "spoolman_url": get_spoolman_web_url(),\n',
              '        "spoolman_url": get_spoolman_web_url(),\n        "spoolman_url_override": CONFIG["spoolman_url"],\n',
              1,
          )

          config_load_marker = '\n\nCONFIG = load_config()\n'
          assert text.count(config_load_marker) == 1
          update_config = '''

def update_public_config(raw):
    if not isinstance(raw, dict):
        raise ValueError("Настройки должны быть JSON-объектом")

    unknown = sorted(set(raw) - {"spoolman_url"})
    if unknown:
        raise ValueError(
            "Через веб-интерфейс нельзя менять параметры: " + ", ".join(unknown)
        )
    if "spoolman_url" not in raw:
        raise ValueError("Не указан параметр spoolman_url")

    candidate = dict(CONFIG)
    candidate["spoolman_url"] = raw.get("spoolman_url")
    validated = validate_config(candidate)

    with lock:
        atomic_write_json(CONFIG_FILE, validated)
        CONFIG.clear()
        CONFIG.update(validated)

    return public_config()
'''
          text = text.replace(config_load_marker, update_config + config_load_marker, 1)

          css_marker = '.diagnostics {\n'
          assert text.count(css_marker) == 1
          settings_css = '''.settings {
  margin-top: 18px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  overflow: hidden;
}

.settings summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 48px;
  padding: 0 16px;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  list-style: none;
}

.settings summary::-webkit-details-marker {
  display: none;
}

.settings-body {
  padding: 0 16px 16px;
}

.settings-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.settings-input {
  flex: 1 1 auto;
  min-width: 0;
  height: 42px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  background: var(--surface2);
  color: var(--text);
}

.settings-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
}

.settings-hint {
  margin-top: 9px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

'''
          text = text.replace(css_marker, settings_css + css_marker, 1)

          html_marker = '  <main class="slots-grid" id="slotsGrid"></main>\n\n  <details class="diagnostics">\n'
          assert text.count(html_marker) == 1
          settings_html = '''  <main class="slots-grid" id="slotsGrid"></main>

  <details class="settings" id="settingsPanel">
    <summary>
      <span>Настройки</span>
      <span>Spoolman</span>
    </summary>

    <div class="settings-body">
      <label class="field-label" for="spoolmanUrlInput">
        Адрес веб-интерфейса Spoolman
      </label>
      <div class="settings-row">
        <input
          class="settings-input"
          id="spoolmanUrlInput"
          type="text"
          inputmode="url"
          autocomplete="url"
          placeholder="http://192.168.1.50:7912"
        >
        <button class="btn btn-primary" id="saveConfigButton" type="button">
          Сохранить
        </button>
      </div>
      <div class="settings-hint" id="spoolmanUrlEffective">
        Если поле пустое, адрес берётся из конфигурации Moonraker.
      </div>
    </div>
  </details>

  <details class="diagnostics">
'''
          text = text.replace(html_marker, settings_html, 1)

          text = text.replace(
              'let requestInProgress = false;\n',
              'let requestInProgress = false;\nlet configData = null;\nlet slotsRenderPending = false;\n',
              1,
          )

          start = text.index('function renderSlots() {')
          end = text.index('\nfunction renderSummary()', start)
          render_block = text[start:end]
          old_tail = '''      renderAll();
    });
  });
}
'''
          assert render_block.count(old_tail) == 1
          new_tail = '''      renderAll();
    });

    select.addEventListener("blur", () => {
      window.setTimeout(() => {
        if (!slotSelectIsActive()) {
          flushPendingSlotsRender();
        }
      }, 0);
    });
  });
}

function slotSelectIsActive() {
  const active = document.activeElement;
  return Boolean(
    active &&
    active.classList &&
    active.classList.contains("slot-select")
  );
}

function renderSlotsPreservingInteraction() {
  if (slotSelectIsActive()) {
    slotsRenderPending = true;
    return;
  }

  slotsRenderPending = false;
  renderSlots();
}

function flushPendingSlotsRender() {
  if (!slotsRenderPending || slotSelectIsActive()) {
    return;
  }

  slotsRenderPending = false;
  renderSlots();
}
'''
          render_block = render_block.replace(old_tail, new_tail, 1)
          text = text[:start] + render_block + text[end:]

          old_render_all = '''function renderAll() {
  renderSummary();
  renderConnection();
  renderSlots();
  renderDiagnostics();
  renderSearchCount();
  renderChangeState();
}
'''
          new_render_all = '''function renderAll() {
  renderSummary();
  renderConnection();
  renderSlotsPreservingInteraction();
  renderDiagnostics();
  renderSearchCount();
  renderChangeState();
}
'''
          assert text.count(old_render_all) == 1
          text = text.replace(old_render_all, new_render_all, 1)

          load_marker = '\nasync function loadData({\n'
          assert text.count(load_marker) == 1
          settings_js = '''
function renderWebSettings() {
  if (!configData) {
    return;
  }

  const input = el("spoolmanUrlInput");
  if (document.activeElement !== input) {
    input.value = configData.spoolman_url_override || "";
  }

  el("spoolmanUrlEffective").textContent = configData.spoolman_url
    ? `Используется: ${configData.spoolman_url}`
    : "Адрес не определён. Укажи URL Spoolman и сохрани настройки.";
}

async function loadWebSettings() {
  try {
    configData = await api("/api/config");
    renderWebSettings();
  } catch (error) {
    el("spoolmanUrlEffective").textContent =
      `Не удалось загрузить настройки: ${error instanceof Error ? error.message : String(error)}`;
  }
}

async function saveWebSettings() {
  const value = el("spoolmanUrlInput").value.trim();
  setLoading(true, "Сохранение настроек…");

  try {
    configData = await api("/api/config", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        spoolman_url: value || null
      })
    });
    renderWebSettings();
    showToast(
      "success",
      "Настройки сохранены",
      configData.spoolman_url
        ? `Spoolman: ${configData.spoolman_url}`
        : "Используется автоматическое определение через Moonraker"
    );
  } catch (error) {
    showToast(
      "error",
      "Ошибка настроек",
      error instanceof Error ? error.message : String(error)
    );
  } finally {
    setLoading(false);
  }
}
'''
          text = text.replace(load_marker, settings_js + load_marker, 1)

          listener_marker = 'el("saveButton").addEventListener("click", saveAssignments);\n'
          assert text.count(listener_marker) == 1
          text = text.replace(
              listener_marker,
              'el("saveConfigButton").addEventListener("click", saveWebSettings);\n' + listener_marker,
              1,
          )

          initial_marker = 'loadData({\n  showLoader: true\n});\n'
          assert text.count(initial_marker) == 1
          text = text.replace(
              initial_marker,
              'void loadWebSettings();\n\n' + initial_marker,
              1,
          )

          post_marker = '            if self.path=="/api/assign":\n'
          assert text.count(post_marker) == 1
          config_post = '''            if self.path=="/api/config":
                body=self.read_json()
                self.send_json(200,update_public_config(body))
                return
'''
          text = text.replace(post_marker, config_post + post_marker, 1)

          p.write_text(text, encoding='utf-8')

          # Native Fluidd header microfix + revision bump.
          vue_path = Path('native-fluidd/overlay/src/components/widgets/ad5x-ifs/Ad5xIfsCard.vue')
          vue = vue_path.read_text(encoding='utf-8')
          needle = '            outlined\n            :disabled="!spoolmanUrl"\n'
          assert vue.count(needle) == 2
          vue = vue.replace(
              needle,
              '            outlined\n            class="ifs-spoolman-link"\n            :disabled="!spoolmanUrl"\n',
              2,
          )
          style_marker = '''.ifs-header-actions--mobile {
  display: none;
}
'''
          assert vue.count(style_marker) == 1
          style_add = style_marker + '''
.ifs-spoolman-link.v-btn--disabled {
  color: inherit !important;
  border-color: currentColor !important;
  opacity: .62 !important;
}
'''
          vue = vue.replace(style_marker, style_add, 1)
          vue_path.write_text(vue, encoding='utf-8')

          cfg_path = Path('native-fluidd/config.json')
          cfg = cfg_path.read_text(encoding='utf-8')
          assert '"patch_revision": 9' in cfg
          cfg_path.write_text(cfg.replace('"patch_revision": 9', '"patch_revision": 10', 1), encoding='utf-8')

          start_path = Path('scripts/start.sh')
          start_text = start_path.read_text(encoding='utf-8')
          assert 'NATIVE_PATCH_REVISION="9"' in start_text
          start_path.write_text(start_text.replace('NATIVE_PATCH_REVISION="9"', 'NATIVE_PATCH_REVISION="10"', 1), encoding='utf-8')
          PY

      - name: Verify GREEN and full offline gate
        run: |
          set -eux
          python3 tests/test_web_manager_ux.py
          python3 tests/test_native_patch_revision.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m py_compile plugin/ifs_spoolman.py
          python3 -m json.tool native-fluidd/config.json >/dev/null
          python3 scripts/test_release_logic.py
          for f in scripts/*.sh *.sh; do sh -n "$f"; done
          git diff --check
          echo "GREEN_GATE_PASS"

      - name: Commit and push release fix
        run: |
          set -eux
          git add plugin/ifs_spoolman.py \
            native-fluidd/overlay/src/components/widgets/ad5x-ifs/Ad5xIfsCard.vue \
            native-fluidd/config.json \
            scripts/start.sh \
            tests/test_native_patch_revision.py \
            tests/test_web_manager_ux.py
          git diff --cached --check
          git commit -m "fix: preserve web manager interaction and settings"
          git push origin HEAD:release/standalone-0.6.x
